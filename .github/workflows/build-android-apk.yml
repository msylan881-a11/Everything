name: Build NAQSH AI APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Find Flutter project
        run: |
          find . -name pubspec.yaml -print

      - name: Build APK
        run: |
          cd "$(dirname "$(find . -name pubspec.yaml -print -quit)")"
          flutter pub get
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NAQSH-AI-APK
          path: '**/build/app/outputs/flutter-apk/app-release.apk'
          if-no-files-found: error
